<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF5EC" />
      <stop offset="70%" stop-color="#EFE3D0" />
      <stop offset="100%" stop-color="#D9C29D" />
    </radialGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#B89758" />
      <stop offset="100%" stop-color="#8C6D32" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#goldGlow)" stroke="url(#goldStroke)" stroke-width="1.5"/>
  <!-- Delicate Inner Ring -->
  <circle cx="50" cy="50" r="43" fill="none" stroke="#607B6A" stroke-width="0.8" stroke-dasharray="2,2"/>
