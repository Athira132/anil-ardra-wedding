<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favLampGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A8" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#8B651B" />
      <stop offset="100%" stop-color="#4A3008" />
    </linearGradient>
    <radialGradient id="favGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FF8C00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="favFlame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#D32F2F" />
      <stop offset="35%" stop-color="#FF8C00" />
      <stop offset="75%" stop-color="#FFEB3B" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Warm Flame Aura -->
  <circle cx="32" cy="18" r="16" fill="url(#favGlow)" />

  <!-- Sacred Flame -->
  <path d="M32 26 Q23 15 32 4 Q41 15 32 26 Z" fill="url(#favFlame)" />
  <path d="M32 24 Q27 16 32 9 Q37 16 32 24 Z" fill="#FFFFFF" />
  <line x1="32" y1="27" x2="32" y2="24" stroke="#331A00" stroke-width="1.5" />

  <!-- Nilavilakku Upper Basin -->
  <path d="M14 27 Q32 24 50 27 Q54 32 46 36 Q32 40 18 36 Q10 32 14 27 Z" fill="url(#favLampGold)" stroke="#3D2507" stroke-width="1" />
  <ellipse cx="32" cy="27" rx="15" ry="4" fill="#6A420B" />
  <path d="M18 33 C22 42, 26 45, 32 45 C38 45, 42 42, 46 33 Z" fill="url(#favLampGold)" stroke="#3D2507" stroke-width="0.8" />

  <!-- Turned Stem -->
  <rect x="29" y="45" width="6" height="8" rx="1.5" fill="url(#favLampGold)" />
  <ellipse cx="32" cy="49" rx="6" ry="2.5" fill="url(#favLampGold)" stroke="#3D2507" stroke-width="0.5" />

  <!-- Base Plate -->
  <path d="M18 57 C22 53, 27 53, 32 53 C37 53, 42 53, 46 57 Z" fill="url(#favLampGold)" />
  <ellipse cx="32" cy="58" rx="20" ry="4.5" fill="url(#favLampGold)" stroke="#3D2507" stroke-width="1" />
</svg>
