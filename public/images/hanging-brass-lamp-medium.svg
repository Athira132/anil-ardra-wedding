<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 332" width="160" height="332" fill="none">
  <defs>
    <linearGradient id="brassChainM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E3510" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="60%" stop-color="#FFF1A8" />
      <stop offset="100%" stop-color="#3A2408" />
    </linearGradient>

    <linearGradient id="brassGoldM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A3008" />
      <stop offset="35%" stop-color="#DDAF3E" />
      <stop offset="52%" stop-color="#FFF6C5" />
      <stop offset="70%" stop-color="#E5B942" />
      <stop offset="100%" stop-color="#4A3008" />
    </linearGradient>

    <radialGradient id="flameGlowM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FFB300" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#FF8F00" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="flameGradM" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#D32F2F" />
      <stop offset="30%" stop-color="#F57C00" />
      <stop offset="70%" stop-color="#FFD600" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <filter id="lampGlowM" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .lamp-flame-m {
        will-change: transform, opacity, filter;
      }
      .flame-m1 {
        transform-origin: 17px 226px;
        animation: naturalMedFlickerA 2.2s ease-in-out infinite 0.15s;
      }
      .flame-m2 {
        transform-origin: 41px 235px;
        animation: naturalMedFlickerB 2.6s ease-in-out infinite 0.4s;
      }
      .flame-mcenter {
        transform-origin: 80px 240px;
        animation: naturalMedFlickerC 3.0s ease-in-out infinite 0.05s;
      }
      .flame-m4 {
        transform-origin: 119px 235px;
        animation: naturalMedFlickerD 2.4s ease-in-out infinite 0.3s;
      }
      .flame-m5 {
        transform-origin: 143px 226px;
        animation: naturalMedFlickerE 2.8s ease-in-out infinite 0.2s;
      }

      .aura-m1 {
        transform-origin: 17px 217px;
        animation: auraMedPulseA 2.2s ease-in-out infinite 0.15s;
      }
      .aura-m2 {
        transform-origin: 41px 225px;
        animation: auraMedPulseB 2.6s ease-in-out infinite 0.4s;
      }
      .aura-mcenter {
        transform-origin: 80px 230px;
        animation: auraMedPulseC 3.0s ease-in-out infinite 0.05s;
      }
      .aura-m4 {
        transform-origin: 119px 225px;
        animation: auraMedPulseD 2.4s ease-in-out infinite 0.3s;
      }
      .aura-m5 {
        transform-origin: 143px 217px;
        animation: auraMedPulseE 2.8s ease-in-out infinite 0.2s;
      }

      @keyframes naturalMedFlickerA {
        0%, 100% {
          transform: scale(1) translateY(0);
          opacity: 0.93;
          filter: drop-shadow(0 0 5px rgba(255, 190, 40, 0.7));
        }
        20% {
          transform: scale(1.02, 0.97) translateY(0.2px);
          opacity: 0.88;
          filter: drop-shadow(0 0 4px rgba(255, 165, 25, 0.6));
        }
        48% {
          transform: scale(0.97, 1.03) translateY(-0.5px);
          opacity: 1;
          filter: drop-shadow(0 0 7.5px rgba(255, 215, 55, 0.85));
        }
        72% {
          transform: scale(1.01, 0.98) translateY(0.1px);
          opacity: 0.92;
          filter: drop-shadow(0 0 5px rgba(255, 180, 35, 0.68));
        }
        88% {
          transform: scale(0.98, 1.02) translateY(-0.3px);
          opacity: 0.97;
          filter: drop-shadow(0 0 7px rgba(255, 205, 50, 0.8));
        }
      }

      @keyframes naturalMedFlickerB {
        0%, 100% {
          transform: scale(1) translateY(0);
          opacity: 0.94;
          filter: drop-shadow(0 0 5.5px rgba(255, 195, 45, 0.72));
        }
        26% {
          transform: scale(0.98, 1.03) translateY(-0.5px);
          opacity: 1;
          filter: drop-shadow(0 0 8px rgba(255, 215, 60, 0.88));
        }
        54% {
          transform: scale(1.02, 0.96) translateY(0.3px);
          opacity: 0.87;
          filter: drop-shadow(0 0 4px rgba(255, 160, 20, 0.58));
        }
        78% {
          transform: scale(0.99, 1.02) translateY(-0.3px);
          opacity: 0.96;
          filter: drop-shadow(0 0 7px rgba(255, 200, 45, 0.8));
        }
      }

      @keyframes naturalMedFlickerC {
        0%, 100% {
          transform: scale(1) translateY(0);
          opacity: 0.95;
          filter: drop-shadow(0 0 6.5px rgba(255, 200, 50, 0.75));
        }
        22% {
          transform: scale(0.97, 1.03) translateY(-0.5px);
          opacity: 1;
          filter: drop-shadow(0 0 8.5px rgba(255, 220, 65, 0.9));
        }
        44% {
          transform: scale(1.01, 0.97) translateY(0.3px);
          opacity: 0.89;
          filter: drop-shadow(0 0 4.5px rgba(255, 168, 25, 0.62));
        }
        68% {
          transform: scale(0.98, 1.02) translateY(-0.3px);
          opacity: 0.98;
          filter: drop-shadow(0 0 7.5px rgba(255, 210, 55, 0.82));
        }
        86% {
          transform: scale(1.01, 0.98) translateY(0.2px);
          opacity: 0.92;
          filter: drop-shadow(0 0 5.5px rgba(255, 180, 30, 0.68));
        }
      }

      @keyframes naturalMedFlickerD {
        0%, 100% {
          transform: scale(1) translateY(0);
          opacity: 0.92;
          filter: drop-shadow(0 0 5px rgba(255, 188, 38, 0.7));
        }
        30% {
          transform: scale(1.02, 0.97) translateY(0.2px);
          opacity: 0.88;
          filter: drop-shadow(0 0 4.2px rgba(255, 162, 22, 0.6));
        }
        56% {
          transform: scale(0.97, 1.03) translateY(-0.5px);
          opacity: 1;
          filter: drop-shadow(0 0 7.8px rgba(255, 212, 55, 0.85));
        }
        82% {
          transform: scale(1.01, 0.99) translateY(0.1px);
          opacity: 0.94;
          filter: drop-shadow(0 0 5.8px rgba(255, 190, 40, 0.72));
        }
      }

      @keyframes naturalMedFlickerE {
        0%, 100% {
          transform: scale(1) translateY(0);
          opacity: 0.93;
          filter: drop-shadow(0 0 5px rgba(255, 185, 36, 0.7));
        }
        24% {
          transform: scale(0.98, 1.02) translateY(-0.4px);
          opacity: 1;
          filter: drop-shadow(0 0 7.5px rgba(255, 210, 52, 0.85));
        }
        52% {
          transform: scale(1.02, 0.97) translateY(0.3px);
          opacity: 0.87;
          filter: drop-shadow(0 0 4px rgba(255, 160, 20, 0.58));
        }
        76% {
          transform: scale(0.99, 1.02) translateY(-0.3px);
          opacity: 0.97;
          filter: drop-shadow(0 0 6.8px rgba(255, 195, 45, 0.78));
        }
      }

      @keyframes auraMedPulseA {
        0%, 100% { opacity: 0.83; transform: scale(1); }
        48% { opacity: 0.97; transform: scale(1.05); }
        72% { opacity: 0.75; transform: scale(0.96); }
      }
      @keyframes auraMedPulseB {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        26% { opacity: 0.98; transform: scale(1.06); }
        54% { opacity: 0.76; transform: scale(0.95); }
      }
      @keyframes auraMedPulseC {
        0%, 100% { opacity: 0.88; transform: scale(1); }
        22% { opacity: 0.98; transform: scale(1.06); }
        44% { opacity: 0.77; transform: scale(0.96); }
        68% { opacity: 0.95; transform: scale(1.04); }
      }
      @keyframes auraMedPulseD {
        0%, 100% { opacity: 0.84; transform: scale(1); }
        56% { opacity: 0.96; transform: scale(1.05); }
        82% { opacity: 0.78; transform: scale(0.96); }
      }
      @keyframes auraMedPulseE {
        0%, 100% { opacity: 0.83; transform: scale(1); }
        24% { opacity: 0.97; transform: scale(1.05); }
        52% { opacity: 0.75; transform: scale(0.95); }
      }

      @media (prefers-reduced-motion: reduce) {
        .lamp-flame-m, .flame-glow-m {
          animation: none !important;
          opacity: 0.94 !important;
          transform: none !important;
          filter: drop-shadow(0 0 5px rgba(255, 190, 40, 0.7)) !important;
        }
      }
    </style>
  </defs>

  <!-- Chain (6 links) -->
  <g id="chainM" stroke="#3D2507" stroke-width="0.8">
    <rect x="78" y="0" width="4" height="4" fill="url(#brassChainM)" stroke="none" />
    <ellipse cx="80" cy="14" rx="4" ry="12" fill="url(#brassChainM)" />
    <ellipse cx="80" cy="14" rx="1.8" ry="7" fill="#1B0F03" />
    <ellipse cx="80" cy="32" rx="3.6" ry="11" fill="url(#brassChainM)" />
    <ellipse cx="80" cy="32" rx="1.6" ry="6" fill="#1B0F03" />
    <ellipse cx="80" cy="50" rx="4" ry="12" fill="url(#brassChainM)" />
    <ellipse cx="80" cy="50" rx="1.8" ry="7" fill="#1B0F03" />
    <ellipse cx="80" cy="68" rx="3.6" ry="11" fill="url(#brassChainM)" />
    <ellipse cx="80" cy="68" rx="1.6" ry="6" fill="#1B0F03" />
    <ellipse cx="80" cy="86" rx="4" ry="12" fill="url(#brassChainM)" />
    <ellipse cx="80" cy="86" rx="1.8" ry="7" fill="#1B0F03" />
    <ellipse cx="80" cy="104" rx="3.6" ry="11" fill="url(#brassChainM)" />
    <ellipse cx="80" cy="104" rx="1.6" ry="6" fill="#1B0F03" />
  </g>

  <!-- Crown Ring & Mount -->
  <circle cx="80" cy="122" r="7" fill="url(#brassGoldM)" stroke="#4A3008" stroke-width="1.2" />
  <circle cx="80" cy="122" r="3.5" fill="#1B0F03" />
  <path d="M74 129 L86 129 L84 138 L76 138 Z" fill="url(#brassGoldM)" />
  <ellipse cx="80" cy="148" rx="20" ry="7" fill="url(#brassGoldM)" stroke="#3D2507" stroke-width="0.8" />

  <!-- Stem -->
  <ellipse cx="80" cy="164" rx="9" ry="7" fill="url(#brassGoldM)" stroke="#4A3008" stroke-width="0.8" />
  <path d="M72 175 C69 184, 68 193, 80 198 C92 193, 91 184, 88 175 Z" fill="url(#brassGoldM)" stroke="#4A3008" stroke-width="0.8" />
  <rect x="73" y="198" width="14" height="5" rx="1.5" fill="url(#brassGoldM)" />
  <path d="M75 203 L85 203 L87 212 L73 212 Z" fill="url(#brassGoldM)" />

  <!-- Oil Dish -->
  <path d="M26 224 Q80 213 134 224 Q141 231 130 236 Q80 245 30 236 Q20 231 26 224 Z" fill="url(#brassGoldM)" stroke="#3D2507" stroke-width="1" />
  <ellipse cx="80" cy="226" rx="48" ry="9" fill="url(#brassGoldM)" />
  <ellipse cx="80" cy="227" rx="42" ry="6" fill="#6E4A10" opacity="0.85" />
  <path d="M30 233 C34 251, 52 263, 80 263 C108 263, 126 251, 130 233 C120 242, 95 246, 80 246 C65 246, 40 242, 30 233 Z" fill="url(#brassGoldM)" stroke="#3D2507" stroke-width="0.8" />

  <!-- Wick Spouts -->
  <path d="M24 223 Q18 225 17 227 Q22 230 28 228 Z" fill="url(#brassGoldM)" />
  <path d="M47 231 Q41 234 39 237 Q46 238 51 235 Z" fill="url(#brassGoldM)" />
  <path d="M76 238 Q80 242 80 243 Q84 242 84 238 Z" fill="url(#brassGoldM)" />
  <path d="M109 235 Q114 238 121 237 Q119 234 113 231 Z" fill="url(#brassGoldM)" />
  <path d="M132 228 Q138 230 143 227 Q142 225 136 223 Z" fill="url(#brassGoldM)" />

  <!-- Ambient Glow Behind Flames -->
  <circle class="flame-glow-m aura-m1" cx="17" cy="217" r="18" fill="url(#flameGlowM)" opacity="0.85" />
  <circle class="flame-glow-m aura-m2" cx="41" cy="225" r="20" fill="url(#flameGlowM)" opacity="0.9" />
  <circle class="flame-glow-m aura-mcenter" cx="80" cy="230" r="22" fill="url(#flameGlowM)" opacity="0.95" />
  <circle class="flame-glow-m aura-m4" cx="119" cy="225" r="20" fill="url(#flameGlowM)" opacity="0.9" />
  <circle class="flame-glow-m aura-m5" cx="143" cy="217" r="18" fill="url(#flameGlowM)" opacity="0.85" />

  <!-- Natural Flickering Lamp Flames -->
  <g class="lamp-flame-m flame-m1">
    <path d="M17 226 Q11 217 17 208 Q23 217 17 226 Z" fill="url(#flameGradM)" filter="url(#lampGlowM)" />
    <path d="M17 225 Q13 219 17 212 Q21 219 17 225 Z" fill="#FFFFF0" />
    <line x1="17" y1="227" x2="17" y2="225" stroke="#331A00" stroke-width="1.2" />
  </g>

  <g class="lamp-flame-m flame-m2">
    <path d="M41 235 Q34 224 41 214 Q48 224 41 235 Z" fill="url(#flameGradM)" filter="url(#lampGlowM)" />
    <path d="M41 234 Q36 226 41 218 Q46 226 41 234 Z" fill="#FFFFF0" />
    <line x1="41" y1="236" x2="41" y2="233" stroke="#331A00" stroke-width="1.2" />
  </g>

  <g class="lamp-flame-m flame-mcenter">
    <path d="M80 240 Q71 227 80 214 Q89 227 80 240 Z" fill="url(#flameGradM)" filter="url(#lampGlowM)" />
    <path d="M80 238 Q74 229 80 220 Q86 229 80 238 Z" fill="#FFFFF0" />
    <line x1="80" y1="242" x2="80" y2="238" stroke="#331A00" stroke-width="1.4" />
  </g>

  <g class="lamp-flame-m flame-m4">
    <path d="M119 235 Q112 224 119 214 Q126 224 119 235 Z" fill="url(#flameGradM)" filter="url(#lampGlowM)" />
    <path d="M119 234 Q114 226 119 218 Q124 226 119 234 Z" fill="#FFFFF0" />
    <line x1="119" y1="236" x2="119" y2="233" stroke="#331A00" stroke-width="1.2" />
  </g>

  <g class="lamp-flame-m flame-m5">
    <path d="M143 226 Q137 217 143 208 Q149 217 143 226 Z" fill="url(#flameGradM)" filter="url(#lampGlowM)" />
    <path d="M143 225 Q139 219 143 212 Q147 219 143 225 Z" fill="#FFFFF0" />
    <line x1="143" y1="227" x2="143" y2="225" stroke="#331A00" stroke-width="1.2" />
  </g>

  <!-- Bottom Mani -->
  <ellipse cx="80" cy="266" rx="5" ry="2.5" fill="url(#brassGoldM)" />
  <ellipse cx="80" cy="273" rx="2.5" ry="5" fill="url(#brassChainM)" />
  <ellipse cx="80" cy="281" rx="2.5" ry="5" fill="url(#brassChainM)" />
  <path d="M75 288 Q80 286 85 288 L87 296 C90 304, 91 308, 91 311 Q80 313 69 311 C69 308, 70 304, 73 296 Z" fill="url(#brassGoldM)" stroke="#3D2507" stroke-width="0.8" />
  <ellipse cx="80" cy="311" rx="11" ry="3" fill="url(#brassGoldM)" />
  <circle cx="80" cy="317" r="3" fill="url(#brassGoldM)" />
  <path d="M78.5 320 L81.5 320 L80 326 Z" fill="url(#brassGoldM)" />
</svg>
