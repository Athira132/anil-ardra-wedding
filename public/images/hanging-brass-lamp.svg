<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 560" width="180" height="560" fill="none">
  <defs>
    <!-- Metallic Brass Linear Gradients -->
    <linearGradient id="brassChainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E3510" />
      <stop offset="25%" stop-color="#8A6218" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="60%" stop-color="#FFF1A8" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="90%" stop-color="#8A6218" />
      <stop offset="100%" stop-color="#3A2408" />
    </linearGradient>

    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A3008" />
      <stop offset="18%" stop-color="#8B651B" />
      <stop offset="42%" stop-color="#DDAF3E" />
      <stop offset="52%" stop-color="#FFF6C5" />
      <stop offset="62%" stop-color="#E5B942" />
      <stop offset="82%" stop-color="#8B651B" />
      <stop offset="100%" stop-color="#4A3008" />
    </linearGradient>

    <linearGradient id="brassGoldVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B8" />
      <stop offset="20%" stop-color="#DDAF3E" />
      <stop offset="60%" stop-color="#8B651B" />
      <stop offset="100%" stop-color="#4A3008" />
    </linearGradient>

    <!-- Warm Flame Radial Glow -->
    <radialGradient id="flameGlowRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#FF8C00" stop-opacity="0.38" />
      <stop offset="80%" stop-color="#FF4500" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Flame Gradient -->
    <linearGradient id="flameGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#D32F2F" />
      <stop offset="25%" stop-color="#F57C00" />
      <stop offset="60%" stop-color="#FFD600" />
      <stop offset="90%" stop-color="#FFFFB0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <filter id="lampGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .lamp-flame, .lamp-aura {
        will-change: opacity, filter;
      }

      .flame-1 { animation: flameGlow1 2.5s ease-in-out infinite alternate; }
      .flame-2 { animation: flameGlow2 3.1s ease-in-out infinite alternate 0.4s; }
      .flame-center { animation: flameGlowCenter 2.8s ease-in-out infinite alternate 0.1s; }
      .flame-4 { animation: flameGlow4 3.4s ease-in-out infinite alternate 0.6s; }
      .flame-5 { animation: flameGlow5 2.7s ease-in-out infinite alternate 0.2s; }

      .aura-1 { animation: auraGlow1 2.5s ease-in-out infinite alternate; }
      .aura-2 { animation: auraGlow2 3.1s ease-in-out infinite alternate 0.4s; }
      .aura-center { animation: auraGlowCenter 2.8s ease-in-out infinite alternate 0.1s; }
      .aura-4 { animation: auraGlow4 3.4s ease-in-out infinite alternate 0.6s; }
      .aura-5 { animation: auraGlow5 2.7s ease-in-out infinite alternate 0.2s; }

      @keyframes flameGlow1 {
        0% {
          opacity: 0.70;
          filter: drop-shadow(0 0 3px rgba(255, 170, 30, 0.5));
        }
        100% {
          opacity: 1.0;
          filter: drop-shadow(0 0 8.5px rgba(255, 210, 50, 0.95)) drop-shadow(0 0 2.5px rgba(255, 245, 170, 0.8));
        }
      }

      @keyframes flameGlow2 {
        0% {
          opacity: 0.72;
          filter: drop-shadow(0 0 3.5px rgba(255, 175, 35, 0.52));
        }
        100% {
          opacity: 1.0;
          filter: drop-shadow(0 0 9px rgba(255, 215, 55, 0.95)) drop-shadow(0 0 3px rgba(255, 245, 175, 0.82));
        }
      }

      @keyframes flameGlowCenter {
        0% {
          opacity: 0.74;
          filter: drop-shadow(0 0 4px rgba(255, 175, 35, 0.55));
        }
        100% {
          opacity: 1.0;
          filter: drop-shadow(0 0 10px rgba(255, 220, 60, 0.96)) drop-shadow(0 0 3.5px rgba(255, 245, 180, 0.85));
        }
      }

      @keyframes flameGlow4 {
        0% {
          opacity: 0.71;
          filter: drop-shadow(0 0 3px rgba(255, 170, 30, 0.5));
        }
        100% {
          opacity: 0.98;
          filter: drop-shadow(0 0 8.5px rgba(255, 210, 50, 0.92)) drop-shadow(0 0 2.5px rgba(255, 240, 165, 0.78));
        }
      }

      @keyframes flameGlow5 {
        0% {
          opacity: 0.70;
          filter: drop-shadow(0 0 3px rgba(255, 170, 30, 0.5));
        }
        100% {
          opacity: 1.0;
          filter: drop-shadow(0 0 8.5px rgba(255, 210, 55, 0.94)) drop-shadow(0 0 2.5px rgba(255, 245, 170, 0.8));
        }
      }

      @keyframes auraGlow1 {
        0% { opacity: 0.55; }
        100% { opacity: 0.95; }
      }

      @keyframes auraGlow2 {
        0% { opacity: 0.58; }
        100% { opacity: 0.97; }
      }

      @keyframes auraGlowCenter {
        0% { opacity: 0.60; }
        100% { opacity: 1.0; }
      }

      @keyframes auraGlow4 {
        0% { opacity: 0.56; }
        100% { opacity: 0.95; }
      }

      @keyframes auraGlow5 {
        0% { opacity: 0.55; }
        100% { opacity: 0.96; }
      }

      @media (prefers-reduced-motion: reduce) {
        .lamp-flame, .lamp-aura {
          animation: none !important;
          opacity: 0.92 !important;
          filter: drop-shadow(0 0 6px rgba(255, 195, 45, 0.75)) !important;
        }
      }
    </style>
  </defs>

  <!-- Hanging Chain Links -->
  <g id="chain" stroke="#3D2507" stroke-width="0.8">
    <ellipse cx="90" cy="15" rx="4.5" ry="14" fill="url(#brassChainGrad)" />
    <ellipse cx="90" cy="15" rx="2" ry="9" fill="#1B0F03" />
    <ellipse cx="90" cy="35" rx="4" ry="13" fill="url(#brassChainGrad)" />
    <ellipse cx="90" cy="35" rx="1.8" ry="8" fill="#1B0F03" />
    <ellipse cx="90" cy="55" rx="4.5" ry="14" fill="url(#brassChainGrad)" />
    <ellipse cx="90" cy="55" rx="2" ry="9" fill="#1B0F03" />
    <ellipse cx="90" cy="75" rx="4" ry="13" fill="url(#brassChainGrad)" />
    <ellipse cx="90" cy="75" rx="1.8" ry="8" fill="#1B0F03" />
    <ellipse cx="90" cy="95" rx="4.5" ry="14" fill="url(#brassChainGrad)" />
    <ellipse cx="90" cy="95" rx="2" ry="9" fill="#1B0F03" />
    <ellipse cx="90" cy="115" rx="4" ry="13" fill="url(#brassChainGrad)" />
    <ellipse cx="90" cy="115" rx="1.8" ry="8" fill="#1B0F03" />
    <ellipse cx="90" cy="135" rx="4.5" ry="14" fill="url(#brassChainGrad)" />
    <ellipse cx="90" cy="135" rx="2" ry="9" fill="#1B0F03" />
    <ellipse cx="90" cy="155" rx="4" ry="13" fill="url(#brassChainGrad)" />
    <ellipse cx="90" cy="155" rx="1.8" ry="8" fill="#1B0F03" />
    <ellipse cx="90" cy="175" rx="4.5" ry="14" fill="url(#brassChainGrad)" />
    <ellipse cx="90" cy="175" rx="2" ry="9" fill="#1B0F03" />
    <ellipse cx="90" cy="195" rx="4.5" ry="14" fill="url(#brassChainGrad)" />
    <ellipse cx="90" cy="195" rx="1.8" ry="8" fill="#1B0F03" />
    <ellipse cx="90" cy="215" rx="4.5" ry="14" fill="url(#brassChainGrad)" />
    <ellipse cx="90" cy="215" rx="2" ry="9" fill="#1B0F03" />
  </g>

  <!-- Top Crown Ring & Mount -->
  <g id="crown-mount">
    <circle cx="90" cy="234" r="8" fill="url(#brassGold)" stroke="#4A3008" stroke-width="1.5" />
    <circle cx="90" cy="234" r="4" fill="#1B0F03" />
    <!-- Crown Finial / Dome -->
    <path d="M83 242 L97 242 L95 252 L85 252 Z" fill="url(#brassGold)" stroke="#3D2507" stroke-width="0.8" />
    <path d="M81 252 Q90 248 99 252 L97 262 L83 262 Z" fill="url(#brassGold)" stroke="#3D2507" stroke-width="0.8" />
    <!-- Upper Canopy Dome -->
    <ellipse cx="90" cy="266" rx="24" ry="8" fill="url(#brassGold)" stroke="#3D2507" stroke-width="1" />
    <path d="M68 266 Q90 256 112 266 Q116 272 110 274 Q90 280 70 274 Q64 272 68 266 Z" fill="url(#brassGold)" />
    <ellipse cx="90" cy="273" rx="21" ry="5" fill="url(#brassGoldVert)" stroke="#4A3008" stroke-width="0.8" />
  </g>

  <!-- Central Fluted Baluster / Stem with Turned Beads -->
  <g id="central-stem">
    <ellipse cx="90" cy="285" rx="10" ry="8" fill="url(#brassGold)" stroke="#4A3008" stroke-width="0.8" />
    <rect x="84" y="293" width="12" height="5" rx="2" fill="url(#brassGold)" stroke="#4A3008" stroke-width="0.6" />
    <path d="M82 298 C78 308, 76 318, 90 324 C104 318, 102 308, 98 298 Z" fill="url(#brassGold)" stroke="#4A3008" stroke-width="0.8" />
    <rect x="82" y="324" width="16" height="6" rx="2" fill="url(#brassGold)" stroke="#4A3008" stroke-width="0.6" />
    <path d="M85 330 L95 330 L98 340 L82 340 Z" fill="url(#brassGold)" stroke="#4A3008" stroke-width="0.8" />
  </g>

  <!-- Main Oil Basin (Thattu) with Wick Spouts -->
  <g id="oil-basin">
    <path d="M32 352 Q90 340 148 352 Q156 360 144 366 Q90 376 36 366 Q24 360 32 352 Z" fill="url(#brassGold)" stroke="#3D2507" stroke-width="1.2" />
    <ellipse cx="90" cy="354" rx="54" ry="11" fill="url(#brassGoldVert)" stroke="#4A3008" stroke-width="0.8" />
    <ellipse cx="90" cy="355" rx="48" ry="8" fill="#6E4A10" opacity="0.85" />
    <ellipse cx="90" cy="355" rx="42" ry="6" fill="#8B5D13" opacity="0.9" />

    <path d="M36 362 C40 382, 60 395, 90 395 C120 395, 140 382, 144 362 C134 372, 106 376, 90 376 C74 376, 46 372, 36 362 Z" fill="url(#brassGold)" stroke="#3D2507" stroke-width="1" />

    <!-- Notches / Spouts for Wicks -->
    <path d="M30 351 Q24 353 22 355 Q28 358 35 356 Z" fill="url(#brassGold)" />
    <path d="M54 360 Q48 364 45 367 Q53 368 59 365 Z" fill="url(#brassGold)" />
    <path d="M86 368 Q90 373 90 374 Q94 373 94 368 Z" fill="url(#brassGold)" />
    <path d="M126 365 Q132 368 135 367 Q132 364 126 360 Z" fill="url(#brassGold)" />
    <path d="M150 351 Q156 353 158 355 Q152 358 145 356 Z" fill="url(#brassGold)" />
  </g>

  <!-- Ambient Warm Aura Behind Flames -->
  <circle class="lamp-aura aura-1" cx="22" cy="345" r="22" fill="url(#flameGlowRadial)" opacity="0.85" />
  <circle class="lamp-aura aura-2" cx="48" cy="355" r="24" fill="url(#flameGlowRadial)" opacity="0.9" />
  <circle class="lamp-aura aura-center" cx="90" cy="360" r="26" fill="url(#flameGlowRadial)" opacity="0.95" />
  <circle class="lamp-aura aura-4" cx="132" cy="355" r="24" fill="url(#flameGlowRadial)" opacity="0.9" />
  <circle class="lamp-aura aura-5" cx="158" cy="345" r="22" fill="url(#flameGlowRadial)" opacity="0.85" />

  <!-- Flames -->
  <g class="lamp-flame flame-1">
    <path d="M22 354 Q15 344 22 334 Q29 344 22 354 Z" fill="url(#flameGrad)" filter="url(#lampGlow)" />
    <path d="M22 353 Q18 346 22 338 Q26 346 22 353 Z" fill="#FFFFF0" />
    <line x1="22" y1="355" x2="22" y2="352" stroke="#331A00" stroke-width="1.5" />
  </g>

  <g class="lamp-flame flame-2">
    <path d="M47 365 Q39 353 47 342 Q55 353 47 365 Z" fill="url(#flameGrad)" filter="url(#lampGlow)" />
    <path d="M47 364 Q42 355 47 346 Q52 355 47 364 Z" fill="#FFFFF0" />
    <line x1="46" y1="367" x2="47" y2="363" stroke="#331A00" stroke-width="1.5" />
  </g>

  <g class="lamp-flame flame-center">
    <path d="M90 370 Q80 356 90 342 Q100 356 90 370 Z" fill="url(#flameGrad)" filter="url(#lampGlow)" />
    <path d="M90 368 Q84 358 90 348 Q96 358 90 368 Z" fill="#FFFFF0" />
    <line x1="90" y1="373" x2="90" y2="368" stroke="#331A00" stroke-width="1.8" />
  </g>

  <g class="lamp-flame flame-4">
    <path d="M133 365 Q125 353 133 342 Q141 353 133 365 Z" fill="url(#flameGrad)" filter="url(#lampGlow)" />
    <path d="M133 364 Q128 355 133 346 Q138 355 133 364 Z" fill="#FFFFF0" />
    <line x1="134" y1="367" x2="133" y2="363" stroke="#331A00" stroke-width="1.5" />
  </g>

  <g class="lamp-flame flame-5">
    <path d="M158 354 Q151 344 158 334 Q165 344 158 354 Z" fill="url(#flameGrad)" filter="url(#lampGlow)" />
    <path d="M158 353 Q154 346 158 338 Q162 346 158 353 Z" fill="#FFFFF0" />
    <line x1="158" y1="355" x2="158" y2="352" stroke="#331A00" stroke-width="1.5" />
  </g>

  <!-- Bottom Pendant Brass Bell -->
  <g id="bottom-mani">
    <ellipse cx="90" cy="398" rx="6" ry="3" fill="url(#brassGold)" stroke="#4A3008" stroke-width="0.8" />
    <ellipse cx="90" cy="406" rx="2.8" ry="6" fill="url(#brassChainGrad)" />
    <ellipse cx="90" cy="416" rx="2.8" ry="6" fill="url(#brassChainGrad)" />
    <path d="M84 424 Q90 422 96 424 L98 434 C102 444, 104 448, 104 452 Q90 454 76 452 C76 448, 78 444, 82 434 Z" fill="url(#brassGold)" stroke="#3D2507" stroke-width="0.8" />
    <ellipse cx="90" cy="452" rx="14" ry="4" fill="url(#brassGoldVert)" stroke="#4A3008" stroke-width="0.8" />
    <circle cx="90" cy="459" r="3.5" fill="url(#brassGold)" stroke="#3D2507" stroke-width="0.8" />
    <path d="M88.5 462 L91.5 462 L90 469 Z" fill="url(#brassGold)" />
  </g>
</svg>
