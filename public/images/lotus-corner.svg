<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="cornerPetalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="50%" stop-color="#F9E0DB" />
      <stop offset="100%" stop-color="#E8A598" />
    </linearGradient>
    <linearGradient id="cornerSageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B8E7B" />
      <stop offset="100%" stop-color="#9CAF88" />
    </linearGradient>
    <linearGradient id="cornerGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B89758" />
    </linearGradient>
  </defs>

  <!-- Corner Ornamental Vines / Borders -->
  <path d="M12 148 L12 12 L148 12" fill="none" stroke="url(#cornerGoldGrad)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M22 140 L22 22 L140 22" fill="none" stroke="#6B8E7B" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.7"/>

  <!-- Sage Leaves along the vines -->
  <path d="M12 60 C5 52 8 40 18 42 C16 52 14 56 12 60 Z" fill="url(#cornerSageGrad)" opacity="0.8"/>
  <path d="M12 95 C4 87 6 75 16 78 C15 88 13 92 12 95 Z" fill="url(#cornerSageGrad)" opacity="0.8"/>
  <path d="M60 12 C52 5 40 8 42 18 C52 16 56 14 60 12 Z" fill="url(#cornerSageGrad)" opacity="0.8"/>
  <path d="M95 12 C87 4 75 6 78 16 C88 15 92 13 95 12 Z" fill="url(#cornerSageGrad)" opacity="0.8"/>

  <!-- Lotus Flower Blossom at the Corner Junction (at 28, 28) -->
  <g transform="translate(18, 18) scale(0.42)">
    <!-- Lily pad base -->
    <ellipse cx="60" cy="80" rx="35" ry="12" fill="url(#cornerSageGrad)" opacity="0.7" transform="rotate(-15 60 80)"/>
    <!-- Outer Petals -->
    <path d="M60 65 C30 75 10 60 20 45 C30 30 50 50 60 65 Z" fill="url(#cornerPetalGrad)" stroke="#B89758" stroke-width="0.8"/>
    <path d="M60 65 C90 75 110 60 100 45 C90 30 70 50 60 65 Z" fill="url(#cornerPetalGrad)" stroke="#B89758" stroke-width="0.8"/>
    <!-- Mid Petals -->
    <path d="M60 65 C40 60 25 40 38 22 C48 10 55 40 60 65 Z" fill="url(#cornerPetalGrad)" stroke="#B89758" stroke-width="0.8"/>
    <path d="M60 65 C80 60 95 40 82 22 C72 10 65 40 60 65 Z" fill="url(#cornerPetalGrad)" stroke="#B89758" stroke-width="0.8"/>
    <!-- Center Petal -->
    <path d="M60 65 C52 48 50 20 60 5 C70 20 68 48 60 65 Z" fill="url(#cornerPetalGrad)" stroke="#D4AF37" stroke-width="1"/>
    <!-- Gold Seed Center -->
    <ellipse cx="60" cy="50" rx="9" ry="7" fill="#D4AF37"/>
  </g>

  <!-- Botanical Tendrils & Gold Accents -->
  <circle cx="12" cy="12" r="3.5" fill="#D4AF37"/>
  <circle cx="148" cy="12" r="2.5" fill="#B89758"/>
  <circle cx="12" cy="148" r="2.5" fill="#B89758"/>
</svg>
