  <defs>
    <linearGradient id="garlandGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B651B" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF2A8" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8B651B" />
    </linearGradient>

    <linearGradient id="garlandFlame" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#E65100" />
      <stop offset="50%" stop-color="#FFD600" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Continuous Upper Brass Chain / Festoon Cord -->
  <line x1="0" y1="8" x2="1200" y2="8" stroke="url(#garlandGold)" stroke-width="2" />
  <line x1="0" y1="12" x2="1200" y2="12" stroke="url(#garlandGold)" stroke-width="0.8" />

