      <line x1="0" y1="16" x2="0" y2="28" stroke="url(#garlandGold)" stroke-width="1" />
      <!-- Mini Hanging Diya -->
      <path d="M-6 32 Q0 30 6 32 Q8 35 5 37 Q0 39 -5 37 Q-8 35 -6 32 Z" fill="url(#garlandGold)" />
      <!-- Flame -->
      <path d="M0 31 Q-3 26 0 20 Q3 26 0 31 Z" fill="url(#garlandFlame)" />
